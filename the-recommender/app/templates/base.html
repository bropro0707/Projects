<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Movie Recommender{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .poster-img { width: 100%; height: auto; border-radius: 4px; }
        .title-card { transition: transform .2s; }
        .title-card:hover { transform: scale(1.03); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Movie Recommender</a>
        <form class="d-flex ms-auto" method="GET" action="{{ url_for('index') }}">
            <input class="form-control me-2" type="search" name="q" placeholder="Search titles..." value="{{ request.args.get('q','') }}">
            <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted py-4 mt-5 border-top">
    <small>Movie Recommender &copy; 2026</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
