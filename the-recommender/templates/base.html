<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}The Recommender{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="The Recommender — discover movies and TV shows matched to your taste.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0d14'/><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237c5cff'/><stop offset='1' stop-color='%232dd4bf'/></linearGradient></defs><path d='M9 11h5v10H9zM18 11h5v10h-5z' fill='url(%23g)'/><circle cx='23.5' cy='8.5' r='2.2' fill='%23ff5c8a'/></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">

  <style>
    :root{
      --brand-left:1rem;
      --bg:#0b0d14;
      --surface:#161a28;
      --surface-2:#1d2334;
      --border:rgba(255,255,255,.09);
      --text:#edf0f8;
      --muted:#98a1b5;
      --violet:#7c5cff;
      --teal:#2dd4bf;
      --pink:#ff5c8a;
      --gradient:linear-gradient(135deg,#7c5cff 0%,#2dd4bf 100%);
      --gradient-soft:linear-gradient(135deg,rgba(124,92,255,.18),rgba(45,212,191,.18));
      --radius:18px;
      --radius-sm:12px;
      --shadow:0 24px 60px rgba(0,0,0,.5);
      --transition:all .35s cubic-bezier(.4,0,.2,1);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:
        radial-gradient(1100px 560px at 85% -10%,rgba(124,92,255,.13),transparent 60%),
        radial-gradient(900px 520px at -5% 15%,rgba(45,212,191,.07),transparent 55%),
        var(--bg);
      background-attachment:fixed;
      color:var(--text);
      font-family:'Inter',sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    ::selection{background:var(--violet);color:#fff}
    ::-webkit-scrollbar{width:9px;height:9px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--violet),var(--teal));border-radius:6px}
    ::-webkit-scrollbar-thumb:hover{background:var(--violet)}

    a{color:inherit}
    img{max-width:100%}

    .grad{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .text-muted{color:var(--muted)!important}

    /* ============ Navbar ============ */
    .navbar{
      position:sticky;top:0;z-index:1000;
      background:rgba(11,13,20,.55);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-bottom:1px solid transparent;
      transition:var(--transition);
    }
    .navbar.scrolled{
      background:rgba(11,13,20,.9);
      border-bottom-color:var(--border);
      box-shadow:0 12px 40px rgba(0,0,0,.5);
    }
    .navbar-brand{
      font-family:'Space Grotesk',sans-serif;
      font-weight:700;font-size:1.3rem;
      color:var(--text);letter-spacing:-.01em;
      display:flex;align-items:center;gap:.65rem;
      transition:var(--transition);
    }
    .navbar-brand:hover{color:#fff}
    .brand-logo{
      width:34px;height:34px;border-radius:10px;
      background:var(--gradient);
      display:inline-flex;align-items:center;justify-content:center;
      color:#0b0d14;font-size:1rem;
      box-shadow:0 4px 18px rgba(124,92,255,.5);
      transition:var(--transition);
    }
    .navbar-brand:hover .brand-logo{transform:rotate(-8deg) scale(1.06)}
    .brand-text{white-space:nowrap}
    .search-form{max-width:380px;transition:opacity .35s ease,visibility .35s ease}
    @media (min-width:992px){
      .search-form.search-hidden{opacity:0;visibility:hidden;pointer-events:none}
    }
    .search-form .form-control{
      background:rgba(255,255,255,.05);
      border:1px solid var(--border);
      color:var(--text);
      border-radius:50rem;
      padding-left:1.2rem;
      transition:var(--transition);
    }
    .search-form .form-control::placeholder{color:var(--muted)}
    .search-form .form-control:focus{
      background:rgba(255,255,255,.07);
      border-color:var(--violet);
      box-shadow:0 0 0 4px rgba(124,92,255,.18);
    }
    .search-form .btn{
      border-radius:50rem;background:var(--gradient);border:none;color:#0b0d14;
      font-weight:600;padding:.375rem 1.05rem;transition:var(--transition);
    }
    .search-form .btn:hover{box-shadow:0 0 20px rgba(124,92,255,.5);transform:scale(1.03)}
    .navbar-toggler:focus{box-shadow:none}

    /* Centered brand + hidden logo while the hero search is on screen (lg+) */
    @media (min-width:992px){
      .navbar .navbar-brand{
        position:absolute;left:var(--brand-left);top:50%;
        transform:translateY(-50%);z-index:2;
        transition:left .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1),color .35s;
      }
      .navbar.search-centered .navbar-brand{left:50%;transform:translate(-50%,-50%)}
      .brand-logo{transition:opacity .3s ease,transform .3s ease}
      .navbar.search-centered .brand-logo{opacity:0;transform:scale(.4)}
    }

    /* ============ Buttons ============ */
    .btn-gradient{
      background:var(--gradient);border:none;color:#0b0d14;font-weight:600;
      border-radius:50rem;padding:.65rem 1.7rem;transition:var(--transition);
    }
    .btn-gradient:hover{
      box-shadow:0 10px 30px rgba(124,92,255,.5);transform:translateY(-3px);color:#0b0d14;
    }
    .btn-ghost{
      border:1px solid var(--border);color:var(--text);background:rgba(255,255,255,.03);
      border-radius:50rem;padding:.65rem 1.7rem;font-weight:500;transition:var(--transition);
    }
    .btn-ghost:hover{
      border-color:var(--violet);color:#fff;box-shadow:0 0 24px rgba(124,92,255,.3);transform:translateY(-3px);
    }

    /* ============ Page / grid backgrounds ============ */
    .page-grid-bg{
      position:fixed;top:0;left:0;right:0;height:100vh;z-index:-1;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 20%,transparent 50%);
      mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 20%,transparent 50%);
    }
    .grid-overlay{
      position:absolute;inset:0;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 0%,#000 35%,transparent 100%);
      mask-image:radial-gradient(ellipse 75% 65% at 50% 0%,#000 35%,transparent 100%);
    }

    /* ============ Hero ============ */
    .hero{position:relative;overflow:hidden}
    .hero-grid-bg{
      position:absolute;inset:0;pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
      background-size:44px 44px;
      -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 0%,#000 35%,transparent 100%);
      mask-image:radial-gradient(ellipse 75% 65% at 50% 0%,#000 35%,transparent 100%);
    }
    .hero-orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;will-change:transform}
    .hero-orb.orb-1{width:430px;height:430px;background:var(--violet);top:-150px;right:-90px;opacity:.5;animation:float 15s ease-in-out infinite}
    .hero-orb.orb-2{width:360px;height:360px;background:var(--teal);bottom:-170px;left:-110px;opacity:.3;animation:float 19s ease-in-out infinite reverse}
    .hero-orb.orb-3{width:260px;height:260px;background:var(--pink);top:34%;left:58%;opacity:.16;animation:float 23s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-34px)}}

    .hero-pill{
      display:inline-flex;align-items:center;gap:.55rem;
      padding:.45rem 1.2rem;border-radius:50rem;
      background:rgba(255,255,255,.05);border:1px solid rgba(124,92,255,.45);
      color:var(--text);font-size:.85rem;font-weight:500;
      backdrop-filter:blur(8px);box-shadow:0 0 30px rgba(124,92,255,.2);
    }
    .hero-pill i{color:var(--teal)}
    .hero-title{
      font-family:'Space Grotesk',sans-serif;font-weight:700;
      font-size:clamp(2.4rem,7vw,4.5rem);line-height:1.05;color:#fff;
      text-wrap:balance;margin:.9rem 0 0;
      text-shadow:0 10px 60px rgba(0,0,0,.45);
    }
    .hero-sub{
      max-width:620px;margin:1.1rem auto 2rem;
      color:var(--muted);font-size:1.08rem;line-height:1.7;
    }
    .hero-search{max-width:640px;margin:0 auto}
    .hero-search .form-control{
      height:56px;font-size:1.05rem;border-radius:50rem;
      background:rgba(255,255,255,.06);border:1px solid var(--border);
      padding-left:1.5rem;color:var(--text);transition:var(--transition);
    }
    .hero-search .form-control:focus{
      background:rgba(255,255,255,.08);border-color:var(--violet);
      box-shadow:0 0 0 5px rgba(124,92,255,.2);
    }
    .hero-search .btn{
      height:56px;padding:0 1.9rem;border-radius:50rem;
      background:var(--gradient);border:none;color:#0b0d14;font-weight:600;font-size:1rem;
      transition:var(--transition);
    }
    .hero-search .btn:hover{box-shadow:0 8px 30px rgba(124,92,255,.5);transform:scale(1.03)}

    .query-chip{
      display:inline-flex;align-items:center;gap:.6rem;
      padding:.5rem 1.1rem;border-radius:50rem;
      background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.5);
      color:#d9d2ff;font-size:.9rem;
    }
    .query-chip a{color:#fff;opacity:.7;transition:opacity .2s}
    .query-chip a:hover{opacity:1}

    .stat-card{
      background:rgba(255,255,255,.04);border:1px solid var(--border);
      border-radius:var(--radius-sm);backdrop-filter:blur(12px);
      transition:var(--transition);position:relative;overflow:hidden;
    }
    .stat-card::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(circle at 50% -30%,rgba(124,92,255,.25),transparent 60%);
      opacity:0;transition:opacity .4s;
    }
    .stat-card:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.55);box-shadow:0 14px 34px rgba(0,0,0,.45)}
    .stat-card:hover::before{opacity:1}
    .stat-card .counter{font-family:'Space Grotesk',sans-serif;font-weight:700;background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .stat-card small{color:var(--muted);letter-spacing:.04em}

    .scroll-hint{color:var(--muted);font-size:.92rem;font-weight:500;transition:var(--transition)}
    .scroll-hint:hover{color:#fff}
    .scroll-hint i{color:var(--teal);animation:bounceDown 2s infinite}
    @keyframes bounceDown{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

    /* ============ Sections ============ */
    .section-head{text-align:center;margin-bottom:2.4rem}
    .section-kicker{
      display:inline-flex;align-items:center;gap:.45rem;
      font-size:.76rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);
    }
    .section-title{
      font-family:'Space Grotesk',sans-serif;font-weight:700;
      font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.15;margin:.5rem 0 0;
      background:linear-gradient(120deg,#fff,var(--muted));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }

    /* ============ Poster cards ============ */
    .poster-card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);overflow:hidden;position:relative;
      transition:var(--transition);
    }
    .poster-card img{transition:transform .6s cubic-bezier(.2,.7,.3,1)}
    .poster-card:hover{
      transform:translateY(-10px);
      border-color:rgba(124,92,255,.6);
      box-shadow:var(--shadow),0 0 44px rgba(124,92,255,.22);
    }
    .poster-card:hover img{transform:scale(1.08)}
    .rating-pill{
      display:inline-flex;align-items:center;gap:.35rem;
      padding:.3rem .65rem;border-radius:50rem;
      background:rgba(11,13,20,.78);border:1px solid rgba(255,255,255,.16);
      backdrop-filter:blur(8px);color:#fff;font-size:.8rem;font-weight:600;line-height:1;
    }
    .rating-pill i{color:#ffd166}
    .type-badge{
      position:absolute;top:.6rem;right:.6rem;padding:.3rem .65rem;border-radius:50rem;
      background:rgba(11,13,20,.78);border:1px solid rgba(255,255,255,.16);
      backdrop-filter:blur(8px);color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.08em;
    }
    .card-overlay{
      position:absolute;inset:0;
      background:linear-gradient(0deg,rgba(11,13,20,.95),rgba(11,13,20,.25) 55%,transparent);
      opacity:0;transition:opacity .35s;
      display:flex;flex-direction:column;justify-content:flex-end;padding:1rem;
    }
    .poster-card:hover .card-overlay{opacity:1}
    .badge-view{
      width:30px;height:30px;border-radius:50%;background:var(--gradient);
      color:#0b0d14;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;
    }

    /* ============ Pagination ============ */
    .pagination{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin:0}
    .page-item{margin:0}
    .page-item + .page-item{margin-left:0}
    .page-link{
      display:flex;align-items:center;justify-content:center;
      min-width:40px;height:40px;padding:0 .6rem;border-radius:12px;
      background:rgba(255,255,255,.04);border:1px solid var(--border);
      color:var(--muted);font-weight:500;font-size:.95rem;text-decoration:none;
      transition:var(--transition);
    }
    .page-link:hover{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.65);color:#fff;transform:translateY(-2px)}
    .page-item.active .page-link{background:var(--gradient);border-color:transparent;color:#0b0d14;font-weight:700;box-shadow:0 8px 26px rgba(124,92,255,.5)}
    .page-item.disabled .page-link{opacity:.35;pointer-events:none}

    /* ============ Empty state ============ */
    .empty-state{max-width:480px;margin:0 auto;padding:3rem 1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
    .empty-icon{
      width:76px;height:76px;border-radius:50%;
      background:var(--gradient-soft);border:1px dashed rgba(124,92,255,.55);
      display:flex;align-items:center;justify-content:center;
      font-size:1.9rem;color:var(--violet);
      animation:spinSlow 16s linear infinite;
    }
    @keyframes spinSlow{to{transform:rotate(360deg)}}

    /* ============ Detail ============ */
    .detail-hero{background:var(--bg)}
    .parallax-bg{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform;filter:brightness(.55)}
    .hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,20,.4),rgba(11,13,20,.78) 45%,var(--bg) 100%)}
    .detail-poster{
      box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 60px rgba(124,92,255,.28);
      border:1px solid rgba(255,255,255,.14);
    }
    .detail-title{
      font-family:'Space Grotesk',sans-serif;font-weight:700;
      font-size:clamp(2rem,5vw,3.4rem);line-height:1.08;color:#fff;
      text-shadow:0 6px 30px rgba(0,0,0,.6);
    }
    .meta-chip{
      display:inline-flex;align-items:center;gap:.4rem;
      padding:.38rem .9rem;border-radius:50rem;
      background:rgba(255,255,255,.07);border:1px solid var(--border);
      color:var(--text);font-size:.85rem;font-weight:500;
    }
    .detail-overview{max-width:720px;line-height:1.8;color:var(--muted);font-size:1.05rem;margin:0}
    .info-tile{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
      padding:1.1rem .9rem;text-align:center;transition:var(--transition);height:100%;
    }
    .info-tile:hover{transform:translateY(-4px);border-color:rgba(124,92,255,.55);box-shadow:0 12px 30px rgba(0,0,0,.35)}
    .info-tile small{color:var(--muted);letter-spacing:.09em;font-size:.7rem;text-transform:uppercase}
    .info-tile .info-value{font-weight:600;font-size:.98rem;margin-top:.35rem}

    /* ============ Back to top ============ */
    .back-to-top{
      position:fixed;right:1.25rem;bottom:1.25rem;z-index:1100;
      width:46px;height:46px;border-radius:50%;
      background:var(--gradient);border:none;color:#0b0d14;
      display:flex;align-items:center;justify-content:center;font-size:1.2rem;
      box-shadow:0 8px 26px rgba(124,92,255,.5);
      opacity:0;transform:translateY(16px);pointer-events:none;
      transition:var(--transition);
    }
    .back-to-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
    .back-to-top:hover{transform:translateY(-4px) scale(1.07);box-shadow:0 12px 34px rgba(124,92,255,.65)}
    .back-to-top:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

    /* ============ Toasts ============ */
    .toast-stack{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:1200;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
    .app-toast{
      display:flex;align-items:center;gap:.6rem;
      padding:.7rem 1.25rem;border-radius:50rem;
      background:rgba(29,35,52,.95);backdrop-filter:blur(14px);
      border:1px solid rgba(124,92,255,.55);color:var(--text);font-size:.9rem;white-space:nowrap;
      box-shadow:0 14px 40px rgba(0,0,0,.55);
      animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3) both;
    }
    .app-toast i{color:var(--teal);font-size:1.05rem}
    .app-toast.hide{animation:toastOut .3s ease both}
    @keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}

    /* ============ Footer ============ */
    footer{background:#080a10;border-top:1px solid var(--border);padding:3rem 0 1.5rem;position:relative;overflow:hidden}
    footer::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--gradient);opacity:.7}
    .footer-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.35rem;color:#fff;display:flex;align-items:center;gap:.6rem}
    .footer-tagline{color:var(--muted);margin-top:.7rem}
    .footer-links a{color:var(--muted);text-decoration:none;margin:0 .85rem;transition:var(--transition);position:relative}
    .footer-links a:hover{color:#fff}
    .footer-links a::after{content:"";position:absolute;left:50%;bottom:-4px;width:0;height:1px;background:var(--teal);transition:width .3s ease,left .3s ease}
    .footer-links a:hover::after{width:100%;left:0}
    .social-icons{display:flex;gap:.6rem;justify-content:center}
    .social-icons a{
      display:inline-flex;align-items:center;justify-content:center;
      width:38px;height:38px;border-radius:50%;
      background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
      font-size:1rem;transition:var(--transition);
    }
    .social-icons a:hover{color:#0b0d14;background:var(--gradient);border-color:transparent;transform:translateY(-3px);box-shadow:0 8px 22px rgba(124,92,255,.45)}

    /* ============ Animations / reveal ============ */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .fade-in-up{animation:fadeInUp .7s cubic-bezier(.2,.7,.3,1) both}
    .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}
    .reveal.visible{opacity:1;transform:none}

    /* ============ Responsive ============ */
    @media (min-width:992px){
      .search-form{width:380px}
      .social-icons{justify-content:flex-end}
    }
    @media (max-width:767.98px){
      .hero{min-height:auto!important}
      .hero-sub{font-size:1rem}
      .stat-card small{font-size:.72rem}
    }
    @media (min-width:768px){:root{--brand-left:3rem}}
    @media (min-width:992px){:root{--brand-left:4rem}}
    @media (max-width:575.98px){
      .hero-title{font-size:2.35rem}
      .hero-search .btn{padding:0 1.3rem}
      .hero-search .btn span{display:none}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <div class="page-grid-bg" aria-hidden="true"></div>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg px-3 px-md-5 py-3" id="mainNavbar">
    <div class="container-fluid px-0 px-lg-3">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <span class="brand-logo"><i class="bi bi-play-fill"></i></span>
        <span class="brand-text">The <span class="grad">Recommender</span></span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent"
              aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list text-light fs-3"></i>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <form class="search-form ms-auto w-100 w-lg-auto my-3 my-lg-0" id="navbarSearch" action="{{ url_for('index') }}" method="GET" role="search">
          <div class="input-group">
            <input class="form-control" type="search" name="q" placeholder="Search movies & shows…"
                   value="{{ request.args.get('q','') }}" aria-label="Search">
            <button class="btn" type="submit"><i class="bi bi-search"></i></button>
          </div>
        </form>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <!-- Footer -->
  <footer>
    <div class="container px-3 px-md-5">
      <div class="row align-items-center">
        <div class="col-12 col-md-6 text-center text-md-start mb-4 mb-md-0">
          <div class="footer-brand justify-content-center justify-content-md-start">
            <span class="brand-logo"><i class="bi bi-play-fill"></i></span>The Recommender
          </div>
          <p class="footer-tagline">Your gateway to stories you'll love.</p>
        </div>
        <div class="col-12 col-md-6">
          <div class="footer-links text-center text-md-end mb-3">
            <a href="#">About</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
          </div>
          <div class="social-icons">
            <a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
            <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
            <a href="#" aria-label="GitHub"><i class="bi bi-github"></i></a>
          </div>
        </div>
      </div>
      <hr class="my-4" style="border-color:var(--border)">
      <p class="text-center small text-muted mb-0">&copy; {{ 2026 }} The Recommender. All rights reserved.</p>
    </div>
  </footer>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <!-- Toast stack -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Global JS -->
  <script>
    // Navbar scroll effect
    const navbar=document.getElementById('mainNavbar');
    window.addEventListener('scroll',()=>{
      if(window.scrollY>20) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    },{passive:true});

    // Navbar search: hide on load while the big hero search is on screen,
    // reveal it once the user scrolls past the hero search bar.
    const navbarSearch=document.getElementById('navbarSearch');
    const heroSearch=document.querySelector('.hero-search');
    if(navbarSearch && heroSearch){
      const hideNavSearch=()=>{
        navbarSearch.classList.add('search-hidden');
        navbar.classList.add('search-centered');
      };
      const showNavSearch=()=>{
        navbarSearch.classList.remove('search-hidden');
        navbar.classList.remove('search-centered');
      };
      if('IntersectionObserver' in window){
        const so=new IntersectionObserver(entries=>{
          entries.forEach(e=>{ e.isIntersecting ? hideNavSearch() : showNavSearch(); });
        },{threshold:0});
        so.observe(heroSearch);
      } else {
        hideNavSearch();
        window.addEventListener('scroll',()=>{
          heroSearch.getBoundingClientRect().bottom<=0 ? showNavSearch() : hideNavSearch();
        },{passive:true});
      }
    }

    // Scroll reveal
    const revealEls=document.querySelectorAll('.reveal');
    if('IntersectionObserver' in window){
      const ro=new IntersectionObserver((entries)=>{
        entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); ro.unobserve(e.target);} });
      },{threshold:.12,rootMargin:'0px 0px -40px 0px'});
      revealEls.forEach(el=>ro.observe(el));
    } else {
      revealEls.forEach(el=>el.classList.add('visible'));
    }

    // Back to top
    const backToTop=document.getElementById('backToTop');
    window.addEventListener('scroll',()=>{
      backToTop.classList.toggle('show',window.scrollY>500);
    },{passive:true});
    backToTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

    // Toast helper
    window.showToast=function(message,icon='bi-check2-circle'){
      const stack=document.getElementById('toastStack');
      const t=document.createElement('div');
      t.className='app-toast';
      t.innerHTML='<i class="bi '+icon+'"></i><span></span>';
      t.querySelector('span').textContent=message;
      stack.appendChild(t);
      setTimeout(()=>{t.classList.add('hide');setTimeout(()=>t.remove(),300);},2400);
    };
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
